log:
  level: INFO

entryPoints:
  web:
    address: ':80'

  flower:
    address: ':5555'

http:
  routers:
    web-router:
      rule: 'Host(`127.0.0.1`) || Host(`localhost`) || Host(`10.244.53.154`)'
      entryPoints:
        - web
      middlewares:
        - csrf
      service: django

    flower-router:
      rule: 'Host(`127.0.0.1`) || Host(`localhost`) || Host(`10.244.53.154`)'
      entryPoints:
        - flower
      service: flower

    web-media-router:
      rule: '(Host(`127.0.0.1`) || Host(`localhost`) || Host(`10.244.53.154`)) && PathPrefix(`/media/`)'
      entryPoints:
        - web
      middlewares:
        - csrf
      service: django-media

  middlewares:
    csrf:
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    flower:
      loadBalancer:
        servers:
          - url: http://flower:5555

    django-media:
      loadBalancer:
        servers:
          - url: http://nginx:80

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
