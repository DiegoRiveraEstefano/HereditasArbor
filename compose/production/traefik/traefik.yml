log:
  level: INFO

certificatesResolvers:
  resolver:
    acme:
      dnsChallenge:
        provider: duckdns

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    address: ':443'
    http:
      tls:
        certResolver: resolver
        domains:
         - main: "hereditasarbor.duckdns.org"
           sans:
              - "*.hereditasarbor.duckdns.org"

http:
  routers:
    web-router:
      rule: 'Host(`hereditasarbor.duckdns.org`) || Host(`www.hereditasarbor.duckdns.org`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: nginx
      tls:
        certResolver: resolver

  middlewares:
    csrf:
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    nginx:
      loadBalancer:
        servers:
          - url: http://nginx:80

providers:
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
