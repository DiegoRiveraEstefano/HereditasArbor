volumes:
  hereditasarbor_local_postgres_data: {}
  hereditasarbor_local_postgres_data_backups: {}
  hereditasarbor_local_redis_data: {}
  hereditasarbor_local_email_data: {}
  hereditasarbor_local_duck_data: {}
  hereditasarbor_local_django_media: {}
  hereditasarbor_local_django_static: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: hereditasarbor_local_django
    container_name: hereditasarbor_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
      - hereditasarbor_local_django_media:/app/hereditasarbor/media
      - hereditasarbor_local_django_static:/app/hereditasarbor/static
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
      - ./.envs/.production/.mail
    command: /start

  traefik:
    build:
      context: .
      dockerfile: ./compose/local/traefik/Dockerfile
    image: hereditasarbor_local_traefik
    depends_on:
      - django
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:5555:5555'

  nginx:
    build:
      context: .
      dockerfile: ./compose/local/nginx/Dockerfile
    image: hereditasarbor_local_nginx
    depends_on:
      - traefik
    volumes:
      - hereditasarbor_local_django_media:/usr/share/nginx/media:ro
      - hereditasarbor_local_django_static:/usr/share/nginx/static:ro

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: hereditasarbor_production_postgres
    container_name: hereditasarbor_local_postgres
    ports:
      - "5432:5432"
    volumes:
      - hereditasarbor_local_postgres_data:/var/lib/postgresql/data
      - hereditasarbor_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: hereditasarbor_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:6
    container_name: hereditasarbor_local_redis
    volumes:
      - hereditasarbor_local_redis_data:/data
    

  celeryworker:
    <<: *django
    image: hereditasarbor_local_celeryworker
    container_name: hereditasarbor_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: hereditasarbor_local_celerybeat
    container_name: hereditasarbor_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

