[project]
name = "hereditasarbor"
version = "0.2.0"
description = "Aplicación web para gestión de salud y genealogía de enfermedades hereditarias"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-slugify>=8.0.4",
    "pillow>=10.4.0",
    "rcssmin>=1.1.2",
    "argon2-cffi>=23.1.0",
    "whitenoise>=6.7.0",
    "redis>=5.0.8",
    "hiredis>=3.0.0",
    "celery>=5.4.0",
    "django-celery-beat>=2.7.0",
    "flower>=2.0.1",
    "uvicorn[standard]>=0.30.6",
    "uvicorn-worker>=0.2.0",
    "cryptography>=43.0.3",
    "numba>=0.60.0",
    "pandas>=2.2.2",
    "django>=5.0.9,<5.2",
    "django-environ>=0.11.2",
    "django-model-utils>=5.0.0",
    "django-crispy-forms>=2.3",
    "django-compressor>=4.5.1",
    "django-redis>=5.4.0",
    "django-filter>=24.3",
    "django-extensions>=3.2.3",
    "django-guardian>=2.4.0",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.4.0",
    "drf-spectacular>=0.27.2",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.2",
    "django-anymail>=12.0",
]

[dependency-groups]
dev = [
    "watchdog>=4.0.2",
    "werkzeug[watchdog]>=3.0.4",
    "ipdb>=0.13.13",
    "watchfiles>=0.24.0",
    "mypy>=1.11.2",
    "django-stubs[compatible-mypy]>=5.1.0",
    "pytest>=8.3.3",
    "pytest-sugar>=1.0.0",
    "djangorestframework-stubs>=3.15.0",
    "sphinx>=8.0.2",
    "sphinx-autobuild>=2024.9.3",
    "ruff>=0.9.0",
    "pyrefly>=1.4.0",
    "coverage>=7.6.1",
    "djlint>=1.35.2",
    "pre-commit>=3.8.0",
    "factory-boy>=3.3.1",
    "django-debug-toolbar>=4.4.6",
    "django-coverage-plugin>=3.1.0",
    "pytest-django>=4.9.0",
]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = ["tests.py", "test_*.py"]

# ==== Coverage ====
[tool.coverage.run]
include = ["hereditasarbor/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

# ==== Ruff ====
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*.py", "staticfiles/*"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TCH",
    "INT",
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "RUF",
]
ignore = [
    "S101",
    "RUF012",
    "SIM102",
    "E501",    # line length in docstrings / comments
    "FBT001",  # boolean positional args in existing functions
    "FBT002",  # boolean default positional args in existing functions
    "PLC0206", # dict iteration style
    "PLC0415", # allow delayed imports in apps/tests
    "PGH004",  # allow general noqa in legacy entrypoints
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==== Pyrefly ====
[tool.pyrefly]
python-version = "3.12"
search-path = ["hereditasarbor"]
ignore-missing-imports = ["*"]
permissive-ignores = true
