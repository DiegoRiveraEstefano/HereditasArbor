{% load allauth %}

{% if attrs.type == "textarea" %}
    <div>
        <label for="{{ attrs.id }}"
               class="block text-sm font-medium leading-6 text-gray-900">
            {% slot label %}
        {% endslot %}
    </label>
    <textarea {% if attrs.required %}required{% endif %}
              {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
              {% if attrs.disabled %}disabled{% endif %}
              {% if attrs.readonly %}readonly{% endif %}
              {% if attrs.checked %}checked{% endif %}
              {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
              {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
              {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
              class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">{% slot value %}{% endslot %}</textarea>
</div>
{% elif attrs.type == "radio" or attrs.type == "checkbox" %}
<div class="relative flex items-start py-4">
    <div class="min-w-0 flex-1 text-sm leading-6">
        <label for="{{ attrs.id }}" class="select-none font-medium text-gray-900">
            {% slot label %}
        {% endslot %}
    </label>
</div>
<div class="ml-3 flex h-6 items-center">
    <input {% if attrs.required %}required{% endif %}
           {% if attrs.disabled %}disabled{% endif %}
           {% if attrs.readonly %}readonly{% endif %}
           {% if attrs.checked %}checked{% endif %}
           {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
           {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
           {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
           {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
           value="{{ attrs.value|default_if_none:"" }}"
           type="{{ attrs.type|default_if_none:"checkbox" }}"
           class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600" />
</div>
</div>
{% else %}
<div>
    <label class="block text-sm font-medium leading-6 text-gray-900"
           for="{{ attrs.id }}">
        {% slot label %}
    {% endslot %}
</label>
<div class="mt-2">
    <input {% if attrs.required %}required{% endif %}
           {% if attrs.disabled %}disabled{% endif %}
           {% if attrs.readonly %}readonly{% endif %}
           {% if attrs.checked %}checked{% endif %}
           {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
           {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
           {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
           {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
           value="{{ attrs.value|default_if_none:"" }}"
           type="{{ attrs.type }}"
           class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6" />
</div>
</div>
{% endif %}
{% if slots.help_text %}
    <div class="form-text">{% slot help_text %}{% endslot %}</div>
{% endif %}
