{% if messages %}
  <div class="messages-container" aria-live="polite">
    {% for message in messages %}
      <div x-data="{ show: true }" x-show="show" class="alert alert-{{ message.tags|default:'info' }}" role="alert">
        <span>{{ message }}</span>
        <button @click="show = false" type="button" class="btn-close" aria-label="Cerrar">&times;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
