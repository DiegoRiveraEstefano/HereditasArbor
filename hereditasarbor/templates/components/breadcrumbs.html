<nav class="flex mt-1">
    <ol class="flex flex-wrap text-xs">
        <li class="inline-flex items-center">
            <a href="{% url "home" %}" class="inline-flex items-center font-medium text-gray-700 hover:text-gray-900">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z">
                    </path>
                </svg>
            </a>
        </li>
        {% with request.path|split:"/"|slice:"1:-1" as paths %}
            {% for item in paths %}
                <li>
                    <div class="flex items-center">
                        <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20"
                            xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd"
                                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                                clip-rule="evenodd">
                            </path>
                        </svg>
                        <a href="/{{ paths|slice:"forloop.counter:"|join:"/" }}/"
                            class="flex font-medium text-gray-700 hover:text-gray-900">{{ item }}
                        </a>
                        
                    </div>
                </li>
            {% endfor %}
        {% endwith %}
    </ol>
</nav>
